spring.application.name=government-subsidy-system
server.port=${SERVER_PORT:8080}

# Database Configuration: Embedded H2 database (with MySQL compatibility)
# Runs out-of-the-box without requiring external database installation
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/subsidy_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER,TIMESTAMP}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=never

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HikariCP Connection Pool
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# File Upload Configuration
app.upload.dir=${APP_UPLOAD_DIR:uploads/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Integration Demo Modes
app.digilocker.mode=DEMO
app.treasury.mode=SIMULATION

# Scheduler
app.scheduling.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.example.governmentsubsidy=INFO
logging.level.org.springframework.security=WARN
